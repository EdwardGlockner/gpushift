<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gpushift</title>
<style>
:root {
  --bg: #ffffff; --panel: #f6f8fa; --ink: #1f2328; --muted: #59636e; --line: #d1d9e0; --track: #e6eaef;
  --accent: #0969da; --good: #1a7f37; --warn: #9a6700; --bad: #cf222e; --frozen: #0550ae;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --panel: #151b23; --ink: #e6edf3; --muted: #9198a1; --line: #3d444d; --track: #262c36;
    --accent: #4493f8; --good: #3fb950; --warn: #d29922; --bad: #f85149; --frozen: #79c0ff; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
main { max-width: 1200px; margin: 0 auto; padding: 20px max(16px, 3vw) 48px; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.pill { padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12.5px; border: 1px solid transparent; }
.pill.normal { color: var(--good); border-color: var(--good); }
.pill.free { color: var(--bad); border-color: var(--bad); }
.muted { color: var(--muted); }
.spacer { flex: 1; }
button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.danger { color: var(--bad); }
button.small { padding: 1px 8px; font-size: 12px; }
.gpus { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.card .top { display: flex; justify-content: space-between; gap: 8px; }
.bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.job { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 6px 10px; background: var(--bg); display: grid; gap: 2px; min-width: 0; }
.job .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.job b { font-weight: 600; }
.cmd { font: 12px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 4px; border: 1px solid; }
.badge.frozen { color: var(--frozen); } .badge.evicting { color: var(--warn); } .badge.over { color: var(--warn); }
.badge.failed { color: var(--bad); } .badge.done { color: var(--good); } .badge.cancelled { color: var(--muted); }
.table { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); }
tr:last-child td { border-bottom: 0; }
td.cmd { max-width: 380px; }
td.note { white-space: normal; color: var(--bad); font-size: 12.5px; min-width: 200px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; }
.empty { color: var(--muted); padding: 10px 2px; }
#error { color: var(--bad); }
</style>

<main>
  <header>
    <h1>gpushift</h1>
    <span id="mode" class="pill normal">…</span>
    <span id="meta" class="muted"></span>
    <span class="spacer"></span>
    <span id="error"></span>
    <button id="free" class="danger" type="button">Free the GPUs</button>
    <button id="resume" type="button" hidden>Resume the queue</button>
  </header>

  <section><h2>GPUs</h2><div id="gpus" class="gpus"></div></section>
  <section><h2 id="qhead">Queue</h2><div id="queue"></div></section>
  <section><h2>Recently ended</h2><div id="recent"></div></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const dur = (s) => {
  if (s == null) return "?";
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return d ? `${d}d${String(h % 24).padStart(2, "0")}h` : h ? `${h}h${String(m % 60).padStart(2, "0")}m` : `${m}m`;
};
const ago = (iso) => (iso ? dur((Date.now() - Date.parse(iso)) / 1000) : "?");
const until = (iso, mode) => {
  if (mode !== "normal") return "paused";
  if (!iso) return "unknown";
  const s = (Date.parse(iso) - Date.now()) / 1000;
  return s < 30 ? "now" : "~" + dur(s);
};
const gb = (mb) => (mb == null ? "?" : (mb / 1024).toFixed(1));
const who = (j) => (j.session ? `${j.project || "Claude"} · ${j.session.slice(0, 4)}` : "you");
const color = (j) => {
  if (!j.session) return "#bc4c00";
  let h = 0;
  for (const c of j.session) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 60% 50%)`;
};

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "X-Gpushift": "1", "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const res = await r.json().catch(() => ({}));
  if (!res.ok) $("error").textContent = res.error || "action failed";
  refresh();
}

function jobCard(j) {
  const exp = j.expected_duration_s;
  const badges = [];
  if (j.state !== "running") badges.push(`<span class="badge ${j.state}">${j.state}</span>`);
  if (j.state === "running" && exp && j.runtime_s > exp) badges.push(`<span class="badge over">over its ${dur(exp)} estimate</span>`);
  const mem = j.vram_now_mb != null ? `${gb(j.vram_now_mb)} GB` : "";
  return `<div class="job" style="--c:${color(j)}">
    <div class="row"><b>${esc(j.tag || "job " + j.id)}</b><span class="muted">job ${j.id} · ${esc(j.preset)} · ${esc(who(j))}</span>
      ${badges.join("")}<span class="spacer"></span><span class="muted">${dur(j.runtime_s)}${mem ? " · " + mem : ""}</span>
      <button class="small danger" data-act="cancel" data-id="${j.id}" type="button">Cancel</button></div>
    <div class="cmd" title="${esc(j.command)}">${esc(j.command)}</div></div>`;
}

function render(s) {
  const free = s.mode !== "normal";
  const mode = $("mode");
  mode.className = "pill " + (free ? "free" : "normal");
  mode.textContent = !free ? "running" : s.auto_free ? `paused: ${(s.auto_free.apps || []).join(", ")} is using the GPU` : "paused (free mode)";
  $("meta").textContent = `${s.slots.used}/${s.slots.total} slots · daemon ${s.daemon.running ? "running" : "NOT running"}${s.fair_share ? " · sessions take turns" : ""}`;
  $("free").hidden = free;
  $("resume").hidden = !free;

  const byId = Object.fromEntries(s.running.map((j) => [j.id, j]));
  $("gpus").innerHTML = s.gpus.map((g) => {
    const used = g.mem_used_mb ?? 0, total = g.mem_total_mb || 1;
    const jobs = g.jobs.map((id) => byId[id]).filter(Boolean);
    return `<div class="card"><div class="top"><b>GPU ${g.index} · ${esc((g.name || "").replace("NVIDIA ", "").replace("GeForce ", ""))}</b>
      <span class="muted">${gb(g.mem_used_mb)} / ${gb(g.mem_total_mb)} GB${g.shared ? " · shared" : ""}</span></div>
      <div class="bar"><span style="width:${(100 * used) / total}%;background:var(--muted)"></span></div>
      ${jobs.length ? jobs.map(jobCard).join("") : '<div class="empty">idle</div>'}</div>`;
  }).join("");
  const cpu = s.running.filter((j) => !j.gpus.length);
  if (cpu.length) $("gpus").innerHTML += `<div class="card"><div class="top"><b>CPU</b></div>${cpu.map(jobCard).join("")}</div>`;

  $("qhead").textContent = `Queue (${s.queue.length} waiting)`;
  $("queue").innerHTML = s.queue.length ? `<div class="table"><table><thead><tr><th>#</th><th>Job</th><th>Who</th><th>Preset</th>
    <th>Waiting</th><th>Starts</th><th>Command</th><th></th></tr></thead><tbody>${s.queue.map((j) => `<tr>
      <td>${j.position}</td><td><span class="dot" style="--c:${color(j)}"></span><b>${esc(j.tag || "")}</b> <span class="muted">${j.id}${j.resume ? " · resumes" : ""}</span></td>
      <td>${esc(who(j))}</td><td>${esc(j.preset)}</td><td>${ago(j.submitted_at)}</td><td>${until(j.est_start, s.mode)}</td>
      <td class="cmd" title="${esc(j.command)}">${esc(j.command)}</td>
      <td><button class="small" data-act="priority" data-id="${j.id}" type="button">To front</button>
          <button class="small danger" data-act="cancel" data-id="${j.id}" type="button">Cancel</button></td></tr>`).join("")}</tbody></table></div>`
    : '<div class="empty">Nothing waiting.</div>';

  $("recent").innerHTML = s.recent.length ? `<div class="table"><table><thead><tr><th>Job</th><th>Result</th><th>Ran</th><th>Ended</th><th>Details</th><th></th></tr></thead>
    <tbody>${s.recent.map((j) => `<tr><td><span class="dot" style="--c:${color(j)}"></span><b>${esc(j.tag || "")}</b> <span class="muted">${j.id}</span></td>
      <td><span class="badge ${j.state}">${j.state}</span></td><td>${dur(j.runtime_s)}</td><td>${ago(j.ended_at)} ago</td>
      <td class="note">${j.state === "failed" ? esc(j.note || "") : ""}</td>
      <td><button class="small" data-act="retry" data-id="${j.id}" type="button">Run again</button></td></tr>`).join("")}</tbody></table></div>`
    : '<div class="empty">No finished jobs yet.</div>';
}

async function refresh() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    render(await r.json());
    if ($("error").textContent === "can't reach the gpushift daemon") $("error").textContent = "";
  } catch {
    $("error").textContent = "can't reach the gpushift daemon";
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (b) post(`/api/${b.dataset.act}/${b.dataset.id}`);
});
$("free").addEventListener("click", () => {
  const b = $("free");
  if (b.dataset.armed) { delete b.dataset.armed; b.textContent = "Free the GPUs"; post("/api/free"); return; }
  b.dataset.armed = "1"; b.textContent = "Click again to free";
  setTimeout(() => { if (b.dataset.armed) { delete b.dataset.armed; b.textContent = "Free the GPUs"; } }, 4000);
});
$("resume").addEventListener("click", () => post("/api/resume"));
refresh();
setInterval(refresh, 2000);
</script>
</html>
