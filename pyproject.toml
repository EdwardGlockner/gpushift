[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpushift"
dynamic = ["version"]
description = "Share one GPU machine between AI coding agents and yourself: a GPU job queue that steps aside when you need the GPUs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edward Glockner" }]
keywords = ["gpu", "queue", "scheduler", "cuda", "machine-learning", "claude-code", "agents"]
dependencies = [
    "psutil>=5.9",
    "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/EdwardGlockner/gpushift"
Issues = "https://github.com/EdwardGlockner/gpushift/issues"
Changelog = "https://github.com/EdwardGlockner/gpushift/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
demo = ["pillow>=10"]

[project.scripts]
gpushift = "gpushift._entry:main"

[tool.hatch.version]
path = "src/gpushift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpushift"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003"]
